<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Adicciones</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN de Supabase para la conexión a la base de datos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="auth-container" class="container">
        <h2>Acceso al Sistema</h2>
        <form id="auth-form">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit" id="login-btn">Iniciar Sesión</button>
            <button type="button" id="register-btn">Registrarse</button>
        </form>
        <p id="auth-message"></p>
    </div>

    <div id="app-container" class="container hidden">
        <header>
            <h2>Mi Control de Adicciones</h2>
            <button id="logout-btn">Cerrar Sesión</button>
        </header>
        
        <main>
            <section class="tracker-section">
                <h3>Registrar Actividad</h3>
                <form id="tracker-form">
                    <input type="text" id="habit-name" placeholder="Ej. Redes Sociales, Azúcar" required>
                    <input type="number" id="habit-level" placeholder="Nivel de ansiedad (1-10)" min="1" max="10" required>
                    <button type="submit">Guardar Registro</button>
                </form>
            </section>
            
            <section class="history-section">
                <h3>Historial de Registros</h3>
                <ul id="history-list">
                    <!-- Los registros se cargarán aquí desde Supabase -->
                </ul>
            </section>
        </main>
    </div>
    <!-- Cargar Supabase antes que tu script local -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
